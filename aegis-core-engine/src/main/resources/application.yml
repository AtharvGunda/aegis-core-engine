server:
  port: 8088

spring:
  application:
    name: AegisCore
    
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_db
    username: postgres
    password: postgres99
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms